[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = app tests
markers =
    unit: offline unit tests (default CI)
    integration: requires isolated Postgres/pgvector; opt-in via RUN_INTEGRATION_TESTS=1
    live_llm: contacts LM Studio or external LLM APIs; never run in default CI
addopts =
    -ra
    -m "not integration and not live_llm"
filterwarnings =
    ignore::DeprecationWarning
