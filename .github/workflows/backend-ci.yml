name: Backend CI

on:
  push:
    branches: [main, dev, yasic]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: ""
      DATABASE_URL_DIRECT: ""
      JWT_SECRET: test-secret-ci-only
      CORS_ORIGINS: http://localhost:3000
      LLM_PROVIDER: openai
      LLM_MODEL: mock-model-for-tests
      LLM_API_KEY: ""
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIM: "384"
      FILE_STORAGE: local
      FILE_STORAGE_PATH: ./data/uploads-test
      RUN_INTEGRATION_TESTS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (C1 + tests)
        run: ruff check app/components/c1_CaseAnalysis tests conftest.py --ignore RUF012,EXE001

      - name: Pytest (offline unit suite)
        run: pytest -m "not integration and not live_llm" --tb=short
